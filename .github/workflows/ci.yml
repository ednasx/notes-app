name: CI

on:
  pull_request:
      branches:
        - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: authdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
        working-directory: services/auth-service

      - name: Run database migrations 
        run: node src/database/migrate.js
        working-directory: services/auth-service
        env: 
          DATABASE_URL: postgresql://authuser:testpassword@localhost:5432/authdb_test
        
      - name: Run tests
        run: npm run test:ci
        working-directory: services/auth-service
        env: 
          DATABASE_URL: postgresql://authuser:testpassword@localhost:5432/authdb_test
