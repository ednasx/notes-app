name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  auth:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: postgresql://authuser:testpassword@localhost:5432/authdb_test
      JWT_SECRET: test-access-secret-for-ci
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci
      JWT_REFRESH_EXPIRES_IN: 7d

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: authdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
        working-directory: services/auth-service

      - name: Run database migrations 
        run: node src/database/migrate.js
        working-directory: services/auth-service
        
      - name: Run tests
        run: npm run test:ci
        working-directory: services/auth-service
  
  
  notes:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://localhost:27017/notesdb_test
      JWT_SECRET: test-access-secret-for-ci

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        
      - name: Install dependencies
        run: npm install
        working-directory: services/notes-service
      
      - name: Run tests
        run: npm run test:ci
        working-directory: services/notes-service
      
      
