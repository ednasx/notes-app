name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # workflow_run fires when CI COMPLETES - pass or fail
    # This guard makes sure the build run only when CI actually succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write  # Having write access to the packages allow CD to push the secret (Github token) into the GHCR (GitHub Container Registry)
    
    strategy:
      matrix: 
        service: [auth-service, notes-service]
    
    steps:
      - name: Check out the exact commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
    
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Whoever/Whatever triggered this CD run is the actor
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Docker's modern build engine; prepares the docker builder to build the image

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true    # So that docker can push the built image into GHCR (GitHub Container Registry)
          tags: |
            ghcr.io/ednasx/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}  
            ghcr.io/ednasx/${{ matrix.service }}:latest