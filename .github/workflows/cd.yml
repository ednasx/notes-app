name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # workflow_run fires when CI COMPLETES - pass or fail
    # This guard makes sure the build run only when CI actually succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write  # Lets the built-in GITHUB_TOKEN push images to GHCR
    
    strategy:
      fail-fast: false  # One image failing must not cancel the other builds
      matrix:
        include: 
          - service: auth-service
            context: ./services/auth-service
            dockerfile: ./services/auth-service/Dockerfile
          - service: notes-service
            context: ./services/notes-service
            dockerfile: ./services/notes-service/Dockerfile
          - service: frontend
            context: .    # Repo root: the Dockerfile copies from frontend/ AND gateway/
            dockerfile: ./frontend/Dockerfile
    
    steps:
      - name: Check out the exact commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
    
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Whoever/Whatever triggered this CD run is the actor
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # Installs QEMU emulation so the amd64 runner can build arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Docker's modern build engine; prepares the docker builder to build the image

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64  # Build BOTH; publishes a manifest list under one tag
          push: true    # So that docker can push the built image into GHCR (GitHub Container Registry)
          tags: |
            ghcr.io/ednasx/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}  
            ghcr.io/ednasx/${{ matrix.service }}:latest