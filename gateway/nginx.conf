server {
    listen 80;
    server_name localhost;

    
    # --- Job 1: serve the built React frontend ---
    root /var/www/notes-app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Job 2: route API calls to the services (unchanged) ---
    location /api/auth/ {
        proxy_pass http://localhost:3001;
        include /home/dbertincentu/projects/personal-project/notes-app/gateway/proxy_params.conf;
    }

    location /api/notes/ {
        proxy_pass http://localhost:3002;
        include /home/dbertincentu/projects/personal-project/notes-app/gateway/proxy_params.conf;       
    }
}