server {
    listen 80;
    server_name localhost;

    # --- Job 1: serve the built React frontend ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Job 2: route API calls to the services ---
    location /api/auth {
        proxy_pass http://auth-service:3001;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/notes {
        proxy_pass http://notes-service:3002;
        include /etc/nginx/proxy_params.conf;
    }
}