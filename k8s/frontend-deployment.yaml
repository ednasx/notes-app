apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/ednasx/frontend:bd563a2c135f10f3a2e2ff0ecbe5d14067b1dcc1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
