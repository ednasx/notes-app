apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/ednasx/frontend:c2df36dd86bc69b99204ada1caed1f0c7c91a3c5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
