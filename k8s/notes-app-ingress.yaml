apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-app
  labels:
    app: notes-app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port: 
                  number: 3001
          - path: /api/notes
            pathType: Prefix
            backend:
              service:
                name: notes-service
                port:
                  number: 3002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  